<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball Catcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- In-Game HUD Elements -->
  <div id="scoreDisplay" class="hidden">SCORE: 0</div>
  <button id="pauseBtn" class="hidden">❚❚</button>

  <!-- Menu Overlay -->
  <div id="menuOverlay">
    <div id="menuPanel">
      <h1>BALL CATCHER</h1>

      <div id="menuStats">
        <p id="highScoreDisplay">HIGH SCORE: 0</p>
        <p id="lastScoreDisplay" class="hidden">LAST SCORE: 0</p>
        <hr class="pixel-divider">
        <p id="totalGamesDisplay">GAMES PLAYED: 0</p>
        <p id="totalPointsDisplay">TOTAL POINTS: 0</p>
      </div>

      <button id="startBtn">START GAME</button>

      <div id="menuFooterButtons">
        <button id="resetDataBtn">RESET DATA</button>
        <button id="muteBtn">🔊 SOUND: ON</button>
      </div>
    </div>
  </div>

  <!-- Pause Overlay -->
  <div id="pauseOverlay" class="hidden">
    <div id="pausePanel">
      <h2>PAUSED</h2>
      <button id="continueBtn">CONTINUE</button>
      <button id="quitBtn">QUIT TO MENU</button>
      <button id="pauseMuteBtn">🔊 SOUND: ON</button>
    </div>
  </div>

  <!-- Reset Confirmation Modal -->
  <div id="resetModal" class="hidden">
    <div id="resetPanel">
      <p>ERASE ALL DATA?</p>
      <p class="reset-warning">THIS CANNOT BE UNDONE</p>
      <div id="resetModalButtons">
        <button id="resetConfirmBtn">YES, RESET</button>
        <button id="resetCancelBtn">CANCEL</button>
      </div>
    </div>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
