<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Route Not Found</title>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-card: rgba(17, 25, 40, 0.85);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.12), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(248, 113, 113, 0.10), transparent 45%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }

    .error-container {
      max-width: 480px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .error-code {
      font-size: clamp(4.5rem, 12vw, 6rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, var(--accent-danger) 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.04em;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #0284c7 100%);
      color: #0b0f19;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: 999px;
      box-shadow: 0 8px 20px -4px rgba(56, 189, 248, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      min-height: 44px;
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -4px rgba(56, 189, 248, 0.6);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1>Route Not Found</h1>
    <p>Looks like you wandered into uncharted territory. The route or asset you requested does not exist on this server.</p>
    <a href="/" class="home-btn">&larr; Back to Home</a>
  </div>
</body>
</html>
