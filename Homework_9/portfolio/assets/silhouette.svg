<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 610" fill="none">
  <!-- Subtle Minimal Frame & Backdrop -->
  <rect width="460" height="610" rx="20" fill="#170212" stroke="#ae8ca3" stroke-opacity="0.3" stroke-width="1.8"/>

  <!-- Ambient Internal Glow behind silhouette -->
  <ellipse cx="230" cy="310" rx="150" ry="190" fill="#22aaa1" fill-opacity="0.05" />
  <circle cx="240" cy="435" r="55" fill="#6dd6da" fill-opacity="0.04" />

  <!-- Shoulders & Upper Torso -->
  <path d="M75 610 Q75 470 140 435 Q190 410 230 408 Q270 410 320 435 Q385 470 385 610 Z"
        fill="#260620" stroke="#ae8ca3" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="200" y="325" width="60" height="95" rx="24" fill="#2d0826" stroke="#ae8ca3" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Head Silhouette (Stylized Oval) -->
  <ellipse cx="230" cy="245" rx="100" ry="122" fill="#320b2b" stroke="#ae8ca3" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Subtle Minimal Facial Contours -->
  <!-- Brow / Forehead contour hint -->
  <path d="M190 192 Q230 184 270 192" stroke="#ae8ca3" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Eye Line Hints -->
  <line x1="172" y1="240" x2="208" y2="240" stroke="#6dd6da" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="252" y1="240" x2="288" y2="240" stroke="#6dd6da" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Heart/Core Node Hint -->
  <circle cx="245" cy="445" r="5" fill="#6dd6da" fill-opacity="0.75"/>
  <circle cx="245" cy="445" r="13" stroke="#6dd6da" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Bottom watermark / placeholder text -->
  <text x="230" y="582" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="11" fill="#ae8ca3" fill-opacity="0.55" letter-spacing="0.12em">PORTRAIT // SYSTEM 01</text>
</svg>
