<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept — Portfolio</title>
    <meta name="description" content="Interactive Function Explainer: drag parameter blocks into a function call to explore design concepts.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Redaction+50:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="concept-body">
    <main class="concept-page">

        <div class="concept-layout">

            <!-- LEFT: Code Text Area -->
            <section class="code-area" aria-label="Interactive function parameter call">
                
                <!-- Function Call Display -->
                <div class="function-call" aria-label="Function Explain call">
                    <span class="fn-keyword">Function</span>
                    <span class="fn-name">Explain</span>
                    <span class="fn-paren">(</span>
                    <div class="param-slot" id="paramSlot" role="region" aria-label="Parameter drop slot">
                        <!-- Drop zone — blocks snap here -->
                    </div>
                    <span class="fn-paren">)</span>
                </div>

                <!-- Draggable Blocks Tray -->
                <div class="blocks-tray" id="blocksTray" aria-label="Available concept parameter blocks">
                    <div class="param-block" id="blockA" data-output="clockNav" role="button" tabindex="0" aria-grabbed="false">
                        Clock Nav
                    </div>
                    <div class="param-block" id="blockB" data-output="functionUI" role="button" tabindex="0" aria-grabbed="false">
                        Function UI
                    </div>
                    <div class="param-block" id="blockC" data-output="bodyConcept" role="button" tabindex="0" aria-grabbed="false">
                        Body
                    </div>
                    <div class="param-block" id="blockD" data-output="rotaryDial" role="button" tabindex="0" aria-grabbed="false">
                        Rotary Dial
                    </div>
                    <div class="param-block param-block--exit" id="blockExit" data-action="exit" role="button" tabindex="0" aria-grabbed="false">
                        Exit
                    </div>
                </div>

                <p class="tray-instruction">Drag or click a parameter block into the function</p>
            </section>

            <!-- RIGHT: Output Box -->
            <section class="output-container" aria-label="Function output console">
                <div class="output-box" id="outputBox" role="region" aria-live="polite">
                    <span class="output-hint">// output</span>
                </div>
            </section>

        </div>

    </main>

    <script src="../js/concept.js"></script>
</body>
</html>
